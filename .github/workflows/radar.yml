name: Radar

on:
  schedule:
    # Every ten minutes. GitHub may start a scheduled run a few minutes late when it is busy.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once would both send the same new jobs.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No packages needed to run: Node runs the TypeScript directly.
      - name: Check the boards
        run: node src/main.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Remember what was seen
        run: |
          git add data/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update seen jobs'
          git pull --rebase
          git push
