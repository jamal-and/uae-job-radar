name: Radar

on:
  schedule:
    # Every ten minutes. GitHub may start a scheduled run a few minutes late when it is busy.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once would both send the same new jobs.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Node runs the TypeScript directly, so only the runtime packages (for email) are needed.
      - run: npm ci --omit=dev

      - name: Check the boards and the inbox
        run: node src/main.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

      - name: Remember what was seen
        run: |
          # A dry run (no Telegram secrets yet) writes nothing.
          if [ ! -f data/seen.json ]; then exit 0; fi
          git add data/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update seen jobs'
          git pull --rebase
          git push
